name: go

on:
  push:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/domainevents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Resolve dependencies
        # go.sum is not committed (no Go toolchain on the authoring machine);
        # tidy resolves the module graph and writes go.sum in CI.
        run: go mod tidy

      - name: Check gofmt (non-blocking)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::These files are not gofmt-ed (run 'gofmt -w .'):"
            echo "$unformatted"
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
