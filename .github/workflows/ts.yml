name: TypeScript

on:
  push:
    paths:
      - 'typescript/**'
      - '.github/workflows/ts.yml'
  pull_request:
    paths:
      - 'typescript/**'
      - '.github/workflows/ts.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
