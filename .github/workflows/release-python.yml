name: release-python

# Publishes apso-domain-events to PyPI when a tag like `py-domain-events-v0.1.0`
# is pushed. Uses PyPI Trusted Publishing (OIDC) — no stored token.
#
# ONE-TIME SETUP (PyPI side): on the apso-domain-events project, add a Trusted
# Publisher → GitHub, owner `apsoai`, repo `apso-packages`, workflow
# `release-python.yml`. (For a brand-new project use PyPI's "pending publisher".)
on:
  push:
    tags:
      - "py-domain-events-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    defaults:
      run:
        working-directory: python/packages/domain-events
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#py-domain-events-v}"
          PKG_VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != pyproject version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/packages/domain-events/dist
