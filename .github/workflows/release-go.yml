name: release-go

# Go modules are "published" simply by pushing a path-prefixed tag — the public
# module proxy serves it on demand; there is no registry upload and no token.
# For the module at go/domainevents the tag MUST be `go/domainevents/vX.Y.Z`.
# This workflow validates the tagged commit and records a GitHub Release.
on:
  push:
    tags:
      - "go/domainevents/v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    defaults:
      run:
        working-directory: go/domainevents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Resolve deps + validate
        run: |
          go get \
            github.com/aws/aws-sdk-go-v2@latest \
            github.com/aws/aws-sdk-go-v2/config@latest \
            github.com/aws/aws-sdk-go-v2/service/sqs@latest \
            github.com/aws/aws-sdk-go-v2/service/eventbridge@latest \
            github.com/segmentio/kafka-go@latest \
            gorm.io/gorm@latest gorm.io/datatypes@latest \
            github.com/google/uuid@latest github.com/glebarez/sqlite@latest
          go mod tidy
          go build ./...
          go test ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Go module \`github.com/apsoai/apso-packages/go/domainevents\` ${GITHUB_REF_NAME##*/}. Install: \`go get github.com/apsoai/apso-packages/go/domainevents@${GITHUB_REF_NAME##*/}\`"
