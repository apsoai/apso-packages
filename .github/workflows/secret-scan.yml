name: secret-scan

# Fail CI if a hardcoded provider credential is committed. See
# apsoai/apso-platform-server#151.

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: No hardcoded credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/secret-scan.sh
