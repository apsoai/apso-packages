name: release-ts

# Publishes @apso/domain-events to npm when a tag like `ts-domain-events-v0.1.0`
# is pushed. The tag version must match the package.json version.
on:
  push:
    tags:
      - "ts-domain-events-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ts-domain-events-v}"
          PKG_VERSION="$(node -p "require('./packages/domain-events/package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build -w @apso/domain-events
      - run: npm test -w @apso/domain-events

      - name: Publish to npm
        run: npm publish -w @apso/domain-events --access public
        env:
          # Organization-level secret (apsoai). Must be an npm automation token
          # with publish rights to the @apso scope.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
