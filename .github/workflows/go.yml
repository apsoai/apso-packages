name: go

on:
  push:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/domainevents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Resolve dependencies
        # go.sum is not committed and the initial go.mod versions were authored
        # without a Go toolchain, so some pins (AWS SDK service modules) may not
        # exist. Resolve real versions from the proxy, then tidy.
        run: |
          go get \
            github.com/aws/aws-sdk-go-v2@latest \
            github.com/aws/aws-sdk-go-v2/config@latest \
            github.com/aws/aws-sdk-go-v2/service/sqs@latest \
            github.com/aws/aws-sdk-go-v2/service/eventbridge@latest \
            github.com/segmentio/kafka-go@latest \
            gorm.io/gorm@latest \
            gorm.io/datatypes@latest \
            github.com/google/uuid@latest \
            github.com/glebarez/sqlite@latest
          go mod tidy

      - name: Check gofmt (non-blocking)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::These files are not gofmt-ed (run 'gofmt -w .'):"
            echo "$unformatted"
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
